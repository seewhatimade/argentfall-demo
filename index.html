<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARGENTFALL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --ui: #262b44; --ui2: #3a4466; --fg: #c0cbdc; --hi: #fee761; --acc: #e43b44; }
  html, body { margin: 0; height: 100%; background: #0d0b14; color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage.editor { inset: 0; }
  canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; cursor: crosshair; }
  .hidden { display: none !important; }
  /* DOM overlays: menus + editor chrome. Everything in-game is drawn on the canvas. */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(13,11,20,.72); z-index: 20; }
  .panel { background: var(--ui); border: 2px solid var(--ui2); border-radius: 6px; padding: 18px 22px; min-width: 320px; max-width: 92vw; max-height: 90vh; overflow: auto; box-shadow: 0 12px 40px #000a; }
  .panel h1 { margin: 0 0 4px; font: 700 28px/1 "Impact", "Arial Black", system-ui; letter-spacing: 2px; color: var(--acc); text-shadow: 3px 3px 0 #000; }
  .panel h2 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #8b9bb4; }
  .panel p { margin: 6px 0; }
  .menu button, button.big { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 12px; font: 600 15px system-ui; color: var(--fg); background: var(--ui2); border: 0; border-radius: 4px; cursor: pointer; }
  .menu button:hover, button.big:hover, .menu button.sel { background: var(--acc); color: #fff; }
  button, select, input { font: 12px system-ui; color: var(--fg); background: var(--ui2); border: 1px solid #5a6988; border-radius: 3px; padding: 3px 7px; }
  button { cursor: pointer; } button:hover { background: #5a6988; } button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  button:disabled { opacity: .45; cursor: default; }
  input[type=number] { width: 58px; } input[type=text] { width: 110px; }
  label { display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; white-space: nowrap; }
  kbd { background: #181425; border: 1px solid #5a6988; border-radius: 3px; padding: 0 5px; font: 11px monospace; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  .muted { color: #8b9bb4; } .small { font-size: 11px; }
  table.stats td { padding: 2px 10px 2px 0; }
  /* Editor chrome */
  #editor-bar { position: fixed; left: 0; right: 0; top: 0; z-index: 10; background: var(--ui); border-bottom: 2px solid var(--ui2); padding: 4px 8px; }
  #editor-bar .row { margin: 2px 0; }
  #editor-side { position: fixed; right: 0; top: 0; bottom: 0; width: 230px; z-index: 9; background: var(--ui); border-left: 2px solid var(--ui2); padding: 8px; overflow: auto; }
  #editor-side h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8b9bb4; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .list .item { display: flex; gap: 4px; align-items: center; padding: 3px 5px; border-radius: 3px; background: #181425; cursor: pointer; }
  .list .item.sel { outline: 2px solid var(--hi); } .list .item:hover { background: #2b3050; }
  .list .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .item button { padding: 0 5px; font-size: 11px; }
  #editor-status { position: fixed; left: 8px; bottom: 6px; z-index: 10; font: 11px monospace; color: #8b9bb4; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, 38px); gap: 3px; }
  .palette .swatch { width: 36px; height: 36px; border: 2px solid #181425; border-radius: 3px; background: #0d0b14; display: grid; place-items: center; cursor: pointer; image-rendering: pixelated; position: relative; }
  .palette .swatch.sel { border-color: var(--hi); } .palette .swatch canvas { image-rendering: pixelated; }
  .palette .swatch .k { position: absolute; right: 1px; bottom: 0; font: 9px monospace; color: #8b9bb4; }
  /* JSON panel */
  #json-panel { position: fixed; z-index: 30; left: 40px; top: 70px; width: 440px; height: 420px; background: #0d1117; border: 2px solid var(--ui2); border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 10px 30px #000a; resize: both; overflow: hidden; }
  #json-panel .title { display: flex; gap: 6px; align-items: center; padding: 4px 8px; background: var(--ui); cursor: move; user-select: none; }
  #json-panel textarea { flex: 1; margin: 0; border: 0; background: #0d1117; color: #c9d1d9; font: 12px/1.35 ui-monospace, monospace; padding: 6px; resize: none; outline: none; white-space: pre; tab-size: 2; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #3a4466; } .badge.warn { background: #a22633; color: #fff; } .badge.ok { background: #3e8948; color: #fff; }
  textarea.code { width: 100%; min-height: 120px; background: #0d1117; color: #c9d1d9; font: 12px/1.35 ui-monospace, monospace; border: 1px solid #5a6988; white-space: pre; tab-size: 2; }
  .err { color: #f6757a; font-family: monospace; white-space: pre-wrap; }
  /* Developer console: slides down from the top on ` */
  #console { position: fixed; left: 0; right: 0; top: 0; height: 46vh; z-index: 200; background: rgba(13,11,20,.94); border-bottom: 2px solid var(--acc); display: flex; flex-direction: column; font: 13px/1.35 ui-monospace, monospace; transform: translateY(-102%); transition: transform .15s ease-out; box-shadow: 0 8px 30px #000a; }
  #console.open { transform: translateY(0); }
  #console .log { flex: 1; overflow: auto; padding: 8px 12px 4px; white-space: pre-wrap; color: #c0cbdc; }
  #console .line { display: flex; gap: 8px; align-items: center; padding: 4px 12px 8px; border-top: 1px solid var(--ui2); color: var(--hi); }
  #console input { flex: 1; background: transparent; border: 0; outline: none; color: #fff; font: inherit; padding: 2px 0; }
  #console .c-in { color: var(--hi); } #console .c-ok { color: #63c74d; } #console .c-err { color: #f6757a; } #console .c-dim { color: #8b9bb4; }
</style>

  panel.append(p);

        }
      });

  },
  confirm(text2, { title = "", ok = "OK", cancel = "Cancel", danger = false } = {}) {

        if (e.key === "Enter") {

        c();
        res(null);
      }], [ok, (c) => {
        c();
        res(input.value);
      }, true]], (e, c) => {

          res(null);
        }

var Game = {
  state: "menu",
  world: null,
  levelJson: null,
  deathT: 0,
  tallyT: 0,
  fromEditor: false,
  onExit: null,
  start(levelJson, opts = {}) {
    this.levelJson = levelJson;
    this.fromEditor = !!opts.fromEditor;
    this.onExit = opts.onExit || null;
    const world2 = new World(levelJson, { progress: Progress });
    this.world = world2;
    world2.hooks = {
      openMenu: (name) => {
        this.pause(false);
        UI.show(name, { onClose: () => this.resume() });
      },
      onDeath: () => {
        this.state = "dead";
        this.deathT = 0;
        Progress.death(world2.id);
        Audio_.stopMusic();
      },
      onWin: () => {
        this.state = "tally";
        this.tallyT = 0;
        Progress.completeLevel(world2.id, { ...world2.stats, time: world2.time });
        Audio_.music("win");
      }
      // the victory sting plays once over the tally
    };
    world2.player?.loadProgress(Progress);
    if (!this.fromEditor) Progress.attempt(world2.id);
    Render.updateCamera(world2, 1, { snap: true });
    this.state = "play";
    Audio_.music(world2.music);
    world2.message(world2.name.toUpperCase(), 3, "yellow");
  },
  pause(showMenu = true) {
    if (this.state !== "play") return;
    this.state = "paused";
    Input.swallowEscape(250);
    if (showMenu) UI.show("pause");
  },
  resume() {
    if (this.state === "paused") {
      this.state = "play";
      UI.hide();
      Input.swallowEscape(250);
      Audio_.resume();
    }
  },
  quit() {
    Audio_.stopMusic();
    UI.hide();
    const ex = this.onExit;
    this.world = null;
    this.state = "menu";
    if (ex) ex();
    else UI.show("main");
  },
  restart() {
    UI.hide();
    this.start(this.levelJson, { fromEditor: this.fromEditor, onExit: this.onExit });
  },
  respawn() {
    const w = this.world, cp = w.checkpoint, p = w.player;
    if (!cp) {
      this.restart();
      return;
    }
    p.restore(cp.snapshot);
    p.layer = cp.layer;
    p.x = cp.x - p.w / 2;
    p.y = cp.y - p.h;
    w.activeLayer = cp.layer;
    for (const e of w.entities) if (e.type === "projectile") e.remove = true;
    for (const m of w.monsters()) {
      if (m.arena) {
        m.remove = true;
        m.dead = true;
      }
    }
    for (const [id, a] of w.arenas) if (a.active) {
      a.active = false;
      a.wave = -1;
      w.unlockArena(id);
      for (const r of w.regions) if (r.id === id) r.inside = false;
    }
    w.messages = [];
    this.state = "play";
    Render.updateCamera(w, 1, { snap: true });
    Audio_.music(w.music);
  },
  update(dt) {
    const w = this.world;
    if (!w) return;
    switch (this.state) {
      case "play":
        if (Input.just("pause")) {
          this.pause();
          return;
        }
        if (Input.just("upgrades")) {
          this.pause(false);
          UI.show("upgrades", { back: "game" });
          return;
        }
        w.update(dt);
        Render.updateCamera(w, dt);
        break;
      case "dead":
        this.deathT += dt;
        w.update(dt * 0.5);
        Render.updateCamera(w, dt);
        if (this.deathT > 1.4 && (Input.mouse.pressed || Input.justKey("Enter") || Input.justKey("Space"))) this.respawn();
        if (Input.just("pause")) this.quit();
        break;
      case "paused":
        if ((Input.just("pause") || Input.just("upgrades")) && ["pause", "upgrades", "settings"].includes(UI.current)) this.resume();
        break;
      case "tally":
        this.tallyT += dt;
        w.update(dt * 0.3);
        if (this.tallyT > 3 && (Input.mouse.pressed || Input.justKey("Enter") || Input.justKey("Space") || Input.just("pause"))) this.quit();
        break;
    }
  },
  draw(g) {
    const w = this.world;
    if (!w) return;
    Render.drawWorld(g, w);
    if (this.state === "dead") HUD.drawDeath(g, w, this.deathT);
    else if (this.state === "tally") HUD.drawTally(g, w, this.tallyT, Progress);
    else HUD.draw(g, w);
  }
};

      } else this.placeAt(tx, ty);
    }
    const d = this.drag;
    if (!d) return;
    if (d.kind === "move") {
      const step = d.half ? 0.5 : 1;
      const dx = Math.round((tx - d.sx) / step) * step, dy = Math.round((ty - d.sy) / step) * step;
      if (dx || dy) {
        if (!d.moved) {
          this.pushHistory();
          d.moved = true;
        }
        for (const s of d.start) {
          s.e.x = clamp(s.x + dx, 0, this.level.width - 1);
          s.e.y = clamp(s.y + dy, 0, this.level.height - 1);
          const ent = this.entMap.get(s.e);
          if (ent) {
            const r = this.entityRect(s.e);
            ent.x = s.e.x * TILE + (ent.w !== void 0 && !ENTITY_SCHEMA[s.e.type]?.size?.length && ENTITY_SCHEMA[s.e.type]?.size !== "rect" ? 0 : 0);
          }
        }
        this.rebuild();
      }
      if (!m.down) {
        this.drag = null;
        if (d.moved) {
          this.markDirty();
          EditorUI.refreshInspector();
        }
      }
    } else if (d.kind === "rect") {
      d.x1 = tx;
      d.y1 = ty;
      if (!m.down) {
        const x0 = Math.min(d.x0, d.x1), y0 = Math.min(d.y0, d.y1);
        this.drag = null;
        this.placeAt(x0, y0, { w: Math.abs(d.x1 - d.x0) + 1, h: Math.abs(d.y1 - d.y0) + 1 });
      }
    } else if (d.kind === "marquee") {
      d.x1 = wx;
      d.y1 = wy;
      if (!m.down) {
        const r = { x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0) };
        for (const e of this.level.entities) {
          if (e.layer !== this.layerId) continue;
          const er = this.entityRect(e);
          if (er.x < r.x + r.w && er.x + er.w > r.x && er.y < r.y + r.h && er.y + er.h > r.y && !this.selection.includes(e)) this.selection.push(e);
        }
        this.drag = null;
        EditorUI.refreshInspector();
      }
    }
  },
  placeAt(tx, ty, extra = {}) {
    if (tx < 0 || ty < 0 || tx >= this.level.width || ty >= this.level.height) return;
    const e = { type: this.place.type, layer: this.layerId, x: tx, y: ty, ...extra };
    if (this.place.kind !== void 0) e.kind = this.place.kind;
    if (e.type === "window") {
      const other = this.level.layers.find((l) => l.id !== this.layerId && (l.parent === this.layerId || this.layer()?.parent === l.id));
      e.shows = other?.id || "";
    }
    this.addEntity(e);
  },
  // ---- draw --------------------------------------------------------------------
  draw(g) {
    const w = this.world;
    if (!w) return;
    w.camera.x = this.cam.x;
    w.camera.y = this.cam.y;
    const L = this.layer();
    Render.drawWorld(g, w, { layer: this.layerId, editor: true, ghost: this.ghost && L?.parent ? L.parent : null });
    const cx = Math.round(this.cam.x), cy = Math.round(this.cam.y);
    if (this.showGrid) {
      g.fillStyle = "rgba(255,255,255,0.07)";
      for (let x = -(cx % TILE); x < W; x += TILE) g.fillRect(x, 0, 1, H);
      for (let y = -(cy % TILE); y < H; y += TILE) g.fillRect(0, y, W, 1);
    }
    g.strokeStyle = PAL.scarlet;
    g.lineWidth = 1;
    g.strokeRect(-cx + 0.5, -cy + 0.5, this.level.width * TILE, this.level.height * TILE);
    if (L?.bounds) {
      const b = L.bounds;
      g.setLineDash([4, 3]);
      g.strokeStyle = PAL.sky;
      g.strokeRect(b.x * TILE - cx + 0.5, b.y * TILE - cy + 0.5, b.w * TILE, b.h * TILE);
      g.setLineDash([]);
    }
    for (const e of this.level.entities) {
      if (e.layer !== this.layerId) continue;
      const r = this.entityRect(e);
      const x = r.x - cx, y = r.y - cy;
      if (e.type === "window") {
        g.fillStyle = "rgba(44,232,245,0.15)";
        g.fillRect(x, y, r.w, r.h);
        g.strokeStyle = PAL.sky;
        g.strokeRect(x + 0.5, y + 0.5, r.w - 1, r.h - 1);
        textShadow(g, `\u2192${e.shows || "?"}`, x + 2, y + 2, PAL.sky);
      } else if (e.type === "region") {
        const col = REGION_COLORS[e.kind] || PAL.white;
        g.setLineDash([3, 2]);
        g.strokeStyle = col;
        g.strokeRect(x + 0.5, y + 0.5, r.w - 1, r.h - 1);
        g.setLineDash([]);
        g.fillStyle = col.replace(")", ",0.08)").replace("rgb", "rgba");
        textShadow(g, `${e.kind}${e.id ? " " + e.id : ""}`, x + 2, y + 2, col);
      } else if (e.type === "spawnpoint") {
        g.drawImage(Art.frame("spawnpoint"), x + 2, y + 2);
        textShadow(g, e.arena || e.tag || "", x, y - 7, PAL.magenta);
      } else if (e.type === "player") {
        textShadow(g, "START", x - 4, y - 8, PAL.lime);
      }
      if ((e.type === "door" || e.type === "teleporter") && e.to) {
        if (e.to.layer === this.layerId) {
          g.strokeStyle = e.type === "door" ? PAL.amber : PAL.sky;
          g.setLineDash([2, 2]);
          g.beginPath();
          g.moveTo(x + r.w / 2, y + r.h / 2);
          g.lineTo(e.to.x * TILE + 8 - cx, e.to.y * TILE + 8 - cy);
          g.stroke();
          g.setLineDash([]);
          g.strokeRect(e.to.x * TILE - cx + 0.5, e.to.y * TILE - cy + 0.5, TILE - 1, TILE - 1);
        } else textShadow(g, `\u2192${e.to.layer}`, x, y - 8, e.type === "door" ? PAL.amber : PAL.sky);
      }
      if (e.type === "monster" && e.dormant) textShadow(g, "zz", x + r.w, y - 4, PAL.silver);
      if (e.tag) textShadow(g, `#${e.tag}`, x, y + r.h + 1, PAL.steel);
    }
    for (const e of this.selection) {
      const r = this.entityRect(e);
      g.strokeStyle = PAL.yellow;
      g.lineWidth = 1;
      g.strokeRect(r.x - cx - 1.5, r.y - cy - 1.5, r.w + 3, r.h + 3);
    }
    const d = this.drag;
    if (d?.kind === "rect" && d.x1 !== void 0) {
      const x0 = Math.min(d.x0, d.x1) * TILE - cx, y0 = Math.min(d.y0, d.y1) * TILE - cy, w2 = (Math.abs(d.x1 - d.x0) + 1) * TILE, h = (Math.abs(d.y1 - d.y0) + 1) * TILE;
      g.fillStyle = "rgba(254,231,97,0.2)";
      g.fillRect(x0, y0, w2, h);
      g.strokeStyle = PAL.yellow;
      g.strokeRect(x0 + 0.5, y0 + 0.5, w2 - 1, h - 1);
    }
    if (d?.kind === "marquee") {
      g.strokeStyle = PAL.yellow;
      g.setLineDash([2, 2]);
      g.strokeRect(Math.min(d.x0, d.x1) - cx + 0.5, Math.min(d.y0, d.y1) - cy + 0.5, Math.abs(d.x1 - d.x0), Math.abs(d.y1 - d.y0));
      g.setLineDash([]);
    }
    if (this.mode?.kind === "bounds" && this.mode.start && this.mode.cur) {
      const s = this.mode.start, c = this.mode.cur;
      g.strokeStyle = PAL.sky;
      g.strokeRect(Math.min(s.tx, c.tx) * TILE - cx + 0.5, Math.min(s.ty, c.ty) * TILE - cy + 0.5, (Math.abs(c.tx - s.tx) + 1) * TILE, (Math.abs(c.ty - s.ty) + 1) * TILE);
    }
    if (Input.mouse.inside && this.hover) {
      const h = this.hover;
      if (this.tool === "tiles") {
        const r = Math.floor((this.brush - 1) / 2);
        g.fillStyle = "rgba(255,255,255,0.25)";
        g.fillRect((h.tx - r) * TILE - cx, (h.ty - r) * TILE - cy, this.brush * TILE, this.brush * TILE);
        g.globalAlpha = 0.6;
        Tiles.draw(g, this.tileChar, h.tx * TILE - cx, h.ty * TILE - cy, { u: false, d: false, l: false, r: false }, h.tx, h.ty, 0);
        g.globalAlpha = 1;
      } else {
        g.strokeStyle = h.e ? PAL.white : "rgba(255,255,255,0.5)";
        g.strokeRect(h.tx * TILE - cx + 0.5, h.ty * TILE - cy + 0.5, TILE - 1, TILE - 1);
        if (!h.e && !this.selection.length && this.mode === null) this.drawPlacePreview(g, h.tx * TILE - cx, h.ty * TILE - cy);
      }
    }
    if (this.mode) {
      g.fillStyle = "rgba(24,20,37,0.85)";
      g.fillRect(0, 0, W, 12);
      textShadow(g, this.mode.kind === "link" ? "LINK MODE: CLICK THE DESTINATION TILE  (ESC CANCELS)" : "DRAG THE INTERIOR BOUNDS  (ESC CANCELS)", W / 2, 3, PAL.yellow, 1, "center");
    }
    const st = document.getElementById("editor-status");
    if (st) st.textContent = `${this.layerId}  \xB7  tile ${this.hover?.tx ?? "-"},${this.hover?.ty ?? "-"}  \xB7  ${this.tool === "tiles" ? `tile "${this.tileChar}" ${Data.tiles[this.tileChar]?.name || ""} brush ${this.brush}` : `${this.place.type}${this.place.kind ? ":" + this.place.kind : ""}`}${this.hover?.e ? `  \xB7  ${this.hover.e.type}${this.hover.e.kind ? ":" + this.hover.e.kind : ""}${this.hover.e.id ? " #" + this.hover.e.id : ""}` : ""}${this.dirty ? "  \xB7  unsaved" : ""}   ${this.status}`;
  },
  drawPlacePreview(g, x, y) {
    const p = this.place;
    g.globalAlpha = 0.55;
    let spr = null;
    if (p.type === "monster") spr = Art.frame(`${Data.monsters[p.kind]?.sprite}_idle`);
    else if (p.type === "pickup") spr = Art.frame(Data.pickups[p.kind]?.sprite);
    else if (p.type === "decor") spr = Art.frame(`decor_${p.kind}`);
    else if (p.type === "door") spr = Art.frame("door", 0);
    else if (p.type === "teleporter") spr = Art.frame("teleporter", 0);
    else if (p.type === "exit") spr = Art.frame("exit_portal", 0);
    else if (p.type === "player") spr = Art.frame("guy_idle", 0);
    else if (p.type === "sign") spr = Art.frame("sign");
    else if (p.type === "mover") spr = Art.frame("mover");
    else if (p.type === "spawnpoint") spr = Art.frame("spawnpoint");
    if (spr) g.drawImage(spr, x + (TILE - spr.width) / 2, y + TILE - spr.height);
    g.globalAlpha = 1;
  }
};

// js/main.js
async function boot() {
  await Data.load();
  Settings.load();
  Progress.load();
  if (Settings.data.binds) Input.binds = { ...Input.binds, ...Settings.data.binds };
  Audio_.volume = Settings.data.volume;
  Audio_.musicVolume = Settings.data.music;
  const canvas = document.getElementById("screen");
  Render.init(canvas);
  Input.attach(canvas);
  const unlock = () => {
    Audio_.init();
    Audio_.resume();
  };
  window.addEventListener("pointerdown", unlock);
  window.addEventListener("keydown", unlock);
  UI.init({
    play: (lvl) => {
      UI.hide();
      Game.start(lvl);
    },
    openEditor: (lvl) => {
      UI.hide();
      Editor.open(lvl);
    },
    resume: () => Game.resume(),
    restart: () => Game.restart(),
    quit: () => Game.quit(),
    isFromEditor: () => Game.fromEditor,
    giveMod: (id, modId) => Game.world?.player?.giveMod(id, modId),
    syncPlayer: () => {
      const p = Game.world?.player;
      if (p) {
        const hp = p.hp, ar = p.armor, ammo = { ...p.ammo };
        p.loadProgress(Progress);
        p.hp = Math.min(hp, p.maxHp) || p.maxHp;
        p.armor = ar;
        p.ammo = ammo;
      }
    },
    // Argent cell: raise the cap and fill the stat to it
    argent: (stat) => {
      const p = Game.world?.player;
      if (!p) return;
      UI.hooks.syncPlayer();
      if (stat === "health") {
        p.hp = p.maxHp;
        Game.world.message(`MAX HEALTH ${p.maxHp}`, 2.5, "sky");
      }
      if (stat === "armor") {
        p.armor = p.maxArmor;
        Game.world.message(`MAX ARMOR ${p.maxArmor}`, 2.5, "lime");
      }
      if (stat === "ammo") {
        for (const a of Object.keys(Data.weapons.ammoMax)) p.ammo[a] = Weapons.ammoMax(a, p);
        Game.world.message("AMMO CAPACITY UP, AMMO FULL", 2.5, "amber");
      }
    }
  });
  UI.show("main");
  Console.init(() => Game);
  let last = performance.now(), acc = 0, fps = 0, frames = 0, fpsT = 0;
  const g = Render.bg;
  function frame(now) {
    const elapsed = Math.min(0.1, (now - last) / 1e3);
    last = now;
    acc += elapsed;
    frames++;
    fpsT += elapsed;
    if (fpsT >= 1) {
      fps = frames;
      frames = 0;
      fpsT = 0;
    }
    const inEditor = Editor.active;
    while (acc >= DT) {
      try {
        if (inEditor) Editor.update(DT);
        else if (!Console.isOpen) Game.update(DT);
      } catch (err) {
        reportError(err);
      }
      Input.endFrame();
      acc -= DT;
    }
    g.imageSmoothingEnabled = false;
    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);
    try {
      if (inEditor) Editor.draw(g);
      else if (Game.world) Game.draw(g);
      else drawTitle(g, now / 1e3);
    } catch (err) {
      reportError(err);
    }
    if (lastError && now - lastErrorAt < 6e3) textShadow(g, `ERROR: ${lastError}`.slice(0, 110), 4, H - 36, PAL.scarlet, 1);
    if (Settings.data.showFps) textShadow(g, `${fps} FPS`, W - 4, H - 36, PAL.steel, 1, "right");
    Render.present();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
var lastError = "";
var lastErrorAt = 0;
var errorCount = 0;
function reportError(err) {
  errorCount++;
  if (errorCount <= 20 || errorCount % 300 === 0) console.error(err);
  lastError = String(err?.message || err);
  lastErrorAt = performance.now();
}
function drawTitle(g, t) {
  const { Art: Art2 } = titleArt;
  g.drawImage(Art2.frame("skybox_mars"), 0, 0);
  const far = Art2.frame("parallax_far");
  for (let x = -(t * 6 % 480); x < W; x += 480) g.drawImage(far, x, 150);
  g.fillStyle = "#3e2731";
  g.fillRect(0, 230, W, 40);
  const guy = Art2.frame("guy_idle", Math.floor(t * 2));
  g.drawImage(guy, 0, 0, guy.width, guy.height, 200, 230 - 54, 42, 54);
  const imp = Art2.frame("imp_walk", Math.floor(t * 6));
  g.drawImage(Art2.flipped(imp), 0, 0, imp.width, imp.height, 300 + Math.sin(t) * 10, 230 - 42, 33, 42);
  const caco2 = Art2.frame("cacodemon_idle", Math.floor(t * 2));
  g.drawImage(caco2, 0, 0, 18, 18, 120, 120 + Math.sin(t * 2) * 8, 54, 54);
}
var titleArt = { Art };
boot().catch((err) => {
  console.error(err);
  document.body.insertAdjacentHTML("beforeend", `<pre class="err" style="position:fixed;inset:20px;overflow:auto">${err.stack || err}</pre>`);
});
</script>
</body>
