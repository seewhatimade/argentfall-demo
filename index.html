<body>
<div id="stage"><canvas id="screen" width="480" height="270"></canvas></div>
<div id="ui"></div>
<div id="editor-bar" class="hidden"></div>
<div id="editor-side" class="hidden"></div>
<div id="editor-status" class="hidden"></div>
<div id="json-panel" class="hidden"></div>
<div id="console"></div>
<!-- Phones and tablets with no mouse get a "play on a computer" notice; the game needs a keyboard and mouse -->
<div id="mobile-gate" class="overlay hidden" style="z-index: 300; background: #0d0b14;">
  <div class="panel" style="min-width: 0; max-width: 360px; text-align: center;">
    <h1>ARGENTFALL</h1>
    <p>This game needs a keyboard and mouse, so it won't work on a phone or tablet.</p>
    <p>Open this page in a browser on your PC or laptop to play.</p>
    <button class="big" id="mobile-gate-copy" style="text-align: center; margin-top: 14px;">Copy link</button>
    <button id="mobile-gate-anyway" style="margin-top: 10px; background: none; border: 0;" class="muted small">Continue anyway</button>
  </div>
</div>
<script>
  (() => {
    const touchOnly = matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches;
    // Stylus phones and Pencil iPads report a fine pointer, so also gate on a mobile browser (iPadOS poses as a Mac)
    const ua = navigator.userAgent;
    const mobileUA = navigator.userAgentData?.mobile || /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (!touchOnly && !mobileUA) return;
    const gate = document.getElementById("mobile-gate"), copy = document.getElementById("mobile-gate-copy");
    gate.classList.remove("hidden");
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); copy.textContent = "Link copied"; }
      catch { copy.textContent = location.href; }
    };
    document.getElementById("mobile-gate-anyway").onclick = () => gate.classList.add("hidden");
  })();
</script>

var Game = {

  start(levelJson, opts = {}) {
    this.levelJson = levelJson;

    this.onExit = opts.onExit || null;
    const world2 = new World(levelJson, { progress: Progress });
    this.world = world2;
    world2.hooks = {
      openMenu: (name) => {
        this.pause(false);
        UI.show(name, { onClose: () => this.resume() });
      },
      onDeath: () => {
        this.state = "dead";
        this.deathT = 0;
        Progress.death(world2.id);
        Audio_.stopMusic();
      },
      onWin: () => {
        this.state = "tally";
        this.tallyT = 0;
        Progress.completeLevel(world2.id, { ...world2.stats, time: world2.finishTime });
        Audio_.music("win");
      }
      // the victory sting plays once over the tally
    };
    world2.player?.loadProgress(Progress);
    if (!this.fromEditor) Progress.attempt(world2.id);
    Render.updateCamera(world2, 1, { snap: true });
    this.state = "play";
    Audio_.music(world2.music);
    world2.message(world2.name.toUpperCase(), 3, "yellow");
  },
  pause(showMenu = true) {
    if (this.state !== "play") return;
    this.state = "paused";
    Input.swallowEscape(250);
    if (showMenu) UI.show("pause");
  },
  resume() {
    if (this.state === "paused") {
      this.state = "play";
      UI.hide();
      Input.swallowEscape(250);
      Audio_.resume();
    }
  },
  quit() {
    Audio_.stopMusic();
    UI.hide();
    const ex = this.onExit;
    this.world = null;
    this.state = "menu";
    if (ex) ex();
    else UI.show("main");
  },
  restart() {
    UI.hide();
    this.start(this.levelJson, { fromEditor: this.fromEditor, onExit: this.onExit });
  },
  respawn() {
    const w = this.world, cp = w.checkpoint, p = w.player;
    if (!cp) {
      this.restart();
      return;
    }
    p.restore(cp.snapshot);
    p.layer = cp.layer;
    p.x = cp.x - p.w / 2;
    p.y = cp.y - p.h;
    w.activeLayer = cp.layer;
    for (const e of w.entities) if (e.type === "projectile") e.remove = true;
    for (const m of w.monsters()) {
      if (m.arena) {
        m.remove = true;
        m.dead = true;
      }
    }
    for (const [id, a2] of w.arenas) if (a2.active) {
      a2.active = false;
      a2.wave = -1;
      a2.pending = false;
      w.unlockArena(id);
      for (const r of w.regions) if (r.id === id) r.inside = false;
    }
    w.messages = [];
    this.state = "play";
    Render.updateCamera(w, 1, { snap: true });
    Audio_.music(w.music);
  },
  update(dt) {
    const w = this.world;
    if (!w) {
      if (UI.current && UI.current !== "main" && Input.just("pause")) {
        UI.show("main");
        Input.swallowEscape(250);
      }
      return;
    }
    switch (this.state) {
      case "play":
        if (Input.just("pause")) {
          this.pause();
          return;
        }
        if (Input.just("upgrades")) {
          this.pause(false);
          UI.show("upgrades", { back: "game" });
          return;
        }
        if (Input.just("pda")) {
          this.pause(false);
          UI.show("pda", { back: "game" });
          return;
        }
        w.update(dt);
        Render.updateCamera(w, dt);
        break;
      case "dead":
        this.deathT += dt;
        w.update(dt * 0.5);
        Render.updateCamera(w, dt);

        break;
      case "paused":
        if ((Input.just("pause") || Input.just("upgrades") || Input.just("pda")) && ["pause", "upgrades", "settings", "pda"].includes(UI.current)) this.resume();
        break;
      case "tally":
        this.tallyT += dt;
        w.update(dt * 0.3);
        if (this.tallyT > 3 && (Input.mouse.pressed || Input.justKey("Enter") || Input.justKey("Space") || Input.just("pause"))) this.quit();
        break;
    }
  },
  draw(g) {
    const w = this.world;
    if (!w) return;
    Render.drawWorld(g, w);
    if (this.state === "dead") HUD.drawDeath(g, w, this.deathT);
    else if (this.state === "tally") HUD.drawTally(g, w, this.tallyT, Progress);
    else HUD.draw(g, w);
  }
};

      }

      drag = { x: e.clientX - el4.offsetLeft, y: e.clientY - el4.offsetTop };
      e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
      if (drag) {
        el4.style.left = `${e.clientX - drag.x}px`;

      }

    window.addEventListener("mouseup", () => drag = null);

  },
  toggle() {

    }
    const d = this.drag;
    if (d?.kind === "rect" && d.x1 !== void 0) {
      const x0 = Math.min(d.x0, d.x1) * TILE - cx, y0 = Math.min(d.y0, d.y1) * TILE - cy, w2 = (Math.abs(d.x1 - d.x0) + 1) * TILE, h = (Math.abs(d.y1 - d.y0) + 1) * TILE;
      g.fillStyle = "rgba(254,231,97,0.2)";
      g.fillRect(x0, y0, w2, h);
      g.strokeStyle = PAL.yellow;
      g.strokeRect(x0 + 0.5, y0 + 0.5, w2 - 1, h - 1);
    }
    if (d?.kind === "marquee") {
      g.strokeStyle = PAL.yellow;
      g.setLineDash([2, 2]);
      g.strokeRect(Math.min(d.x0, d.x1) - cx + 0.5, Math.min(d.y0, d.y1) - cy + 0.5, Math.abs(d.x1 - d.x0), Math.abs(d.y1 - d.y0));
      g.setLineDash([]);
    }
    if (this.tool === "select") {
      const ants = (x, y, w2, h) => {
        g.setLineDash([3, 3]);
        g.lineDashOffset = -(performance.now() / 80) % 6;
        g.strokeStyle = PAL.white;
        g.strokeRect(x * TILE - cx + 0.5, y * TILE - cy + 0.5, w2 * TILE - 1, h * TILE - 1);
        g.lineDashOffset = 0;
        g.setLineDash([]);
      };
      if (d?.kind === "tilesel") {
        const x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1), w2 = Math.abs(d.x1 - d.x0) + 1, h = Math.abs(d.y1 - d.y0) + 1;
        g.fillStyle = "rgba(255,255,255,0.12)";
        g.fillRect(x * TILE - cx, y * TILE - cy, w2 * TILE, h * TILE);
        ants(x, y, w2, h);
        textShadow(g, `${w2}x${h}`, x * TILE - cx, y * TILE - cy - 8, PAL.white);
      } else if (this.tileSel) {
        const r = this.tileSel;
        if (d?.kind === "tilemove" && (d.dx || d.dy)) {
          g.fillStyle = "rgba(8,6,14,0.55)";
          g.fillRect(r.x * TILE - cx, r.y * TILE - cy, r.w * TILE, r.h * TILE);
          this.drawClip(g, this.captureTiles(), r.x + d.dx, r.y + d.dy, cx, cy);
          ants(r.x + d.dx, r.y + d.dy, r.w, r.h);
        } else {
          ants(r.x, r.y, r.w, r.h);
          textShadow(g, `${r.w}x${r.h}`, r.x * TILE - cx, r.y * TILE - cy - 8, PAL.white);
        }
      }
      if (this.pasting && this.hover && Input.mouse.inside) {
        const c = this.pasting;
        this.drawClip(g, c, this.hover.tx, this.hover.ty, cx, cy);
        ants(this.hover.tx, this.hover.ty, c.w, c.h);
      }
    }
    if (this.mode?.kind === "bounds" && this.mode.start && this.mode.cur) {
      const s = this.mode.start, c = this.mode.cur;
      g.strokeStyle = PAL.sky;
      g.strokeRect(Math.min(s.tx, c.tx) * TILE - cx + 0.5, Math.min(s.ty, c.ty) * TILE - cy + 0.5, (Math.abs(c.tx - s.tx) + 1) * TILE, (Math.abs(c.ty - s.ty) + 1) * TILE);
    }
    if (Input.mouse.inside && this.hover) {
      const h = this.hover;
      if (this.mode) {
        const link = this.mode.kind === "link";
        const door = link && this.level.entities.find((e) => e.type === "door" && e.layer === this.layerId && e !== this.mode.entity && Math.floor(e.x) === h.tx && h.ty >= Math.floor(e.y) && h.ty <= Math.floor(e.y) + 1);
        const ty = door ? Math.floor(door.y) : h.ty, rows = door ? 2 : 1;
        g.strokeStyle = link ? PAL.amber : PAL.sky;
        g.lineWidth = 1;
        g.strokeRect(h.tx * TILE - cx + 0.5, ty * TILE - cy + 0.5, TILE - 1, rows * TILE - 1);
        g.strokeRect(h.tx * TILE - cx - 1.5, ty * TILE - cy - 1.5, TILE + 3, rows * TILE + 3);
      } else if (this.tool === "select") {
        if (!this.pasting) {
          g.strokeStyle = "rgba(255,255,255,0.6)";
          g.strokeRect(h.tx * TILE - cx + 0.5, h.ty * TILE - cy + 0.5, TILE - 1, TILE - 1);
        }
      } else if (this.tool === "tiles") {
        const r = Math.floor((this.brush - 1) / 2);
        g.fillStyle = "rgba(255,255,255,0.25)";
        g.fillRect((h.tx - r) * TILE - cx, (h.ty - r) * TILE - cy, this.brush * TILE, this.brush * TILE);
        g.globalAlpha = 0.6;
        Tiles.draw(g, this.tileChar, h.tx * TILE - cx, h.ty * TILE - cy, { u: false, d: false, l: false, r: false }, h.tx, h.ty, 0);
        g.globalAlpha = 1;
      } else {
        g.strokeStyle = h.e ? PAL.white : "rgba(255,255,255,0.5)";
        g.strokeRect(h.tx * TILE - cx + 0.5, h.ty * TILE - cy + 0.5, TILE - 1, TILE - 1);
        if (!h.e && !this.selection.length && this.mode === null) this.drawPlacePreview(g, h.tx * TILE - cx, h.ty * TILE - cy);
      }
    }
    if (this.mode) {
      g.fillStyle = "rgba(24,20,37,0.85)";
      g.fillRect(0, 0, W, 12);
      textShadow(g, this.mode.kind === "link" ? "LINK MODE: CLICK THE DESTINATION TILE  (ESC CANCELS)" : "DRAG THE INTERIOR BOUNDS  (ESC CANCELS)", W / 2, 3, PAL.yellow, 1, "center");
    }
    const st = document.getElementById("editor-status");
    if (st) st.textContent = `${this.layerId}  \xB7  tile ${this.hover?.tx ?? "-"},${this.hover?.ty ?? "-"}${this.mode ? "" : `  \xB7  ${this.tool === "tiles" ? `tile "${this.tileChar}" ${Data.tiles[this.tileChar]?.name || ""} brush ${this.brush}` : `${this.place.type}${this.place.kind ? ":" + this.place.kind : ""}`}`}${this.hover?.e ? `  \xB7  ${this.hover.e.type}${this.hover.e.kind ? ":" + this.hover.e.kind : ""}${this.hover.e.id ? " #" + this.hover.e.id : ""}` : ""}${this.dirty ? "  \xB7  unsaved" : ""}   ${this.status}`;
  },
  /**
   * Collision view: tint each visible tile by what it does, so look-alikes (a fake wall and real metal, facade and
   * brick) tell apart on the map. Solid areas are outlined where they meet anything else; backdrop stays bare.
   */
  drawCollision(g, cx, cy) {
    const L = this.layer();
    if (!L) return;
    const T = Tiles.TRAITS, alpha = (hex, a2) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a2})`;
    const solidAt = (x, y) => !!Data.tiles[L.tiles[y]?.[x]]?.solid;
    const x0 = Math.max(0, Math.floor(cx / TILE)), y0 = Math.max(0, Math.floor(cy / TILE));
    const x1 = Math.min(this.level.width - 1, Math.floor((cx + W) / TILE)), y1 = Math.min(this.level.height - 1, Math.floor((cy + H) / TILE));
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const ch = L.tiles[ty][tx];
      if (ch === ".") continue;
      const tr = Tiles.traits(ch);
      if (!tr.length) continue;
      const x = tx * TILE - cx, y = ty * TILE - cy;
      if (tr.includes("solid")) {
        g.fillStyle = alpha(T.solid.col, 0.14);
        g.fillRect(x, y, TILE, TILE);
        g.fillStyle = T.solid.col;
        if (!solidAt(tx, ty - 1)) g.fillRect(x, y, TILE, 1);
        if (!solidAt(tx, ty + 1)) g.fillRect(x, y + TILE - 1, TILE, 1);
        if (!solidAt(tx - 1, ty)) g.fillRect(x, y, 1, TILE);
        if (!solidAt(tx + 1, ty)) g.fillRect(x + TILE - 1, y, 1, TILE);
      }
      if (tr.includes("oneway")) {
        g.fillStyle = T.oneway.col;
        g.fillRect(x, y, TILE, 2);
      }
      if (tr.includes("ladder")) {
        g.fillStyle = alpha(T.ladder.col, 0.3);
        g.fillRect(x, y, TILE, TILE);
      }
      if (tr.includes("liquid") && !tr.includes("damage")) {
        g.fillStyle = alpha(T.liquid.col, 0.3);
        g.fillRect(x, y, TILE, TILE);
      }
      if (tr.includes("damage")) {
        g.fillStyle = alpha(T.damage.col, 0.45);
        g.fillRect(x, y, TILE, TILE);
      }
      if (tr.includes("breakable") || tr.includes("fake")) {
        const col = tr.includes("fake") ? T.fake.col : T.breakable.col;
        g.fillStyle = alpha(col, 0.3);
        g.fillRect(x, y, TILE, TILE);
        g.fillStyle = col;
        for (let i = 0; i < TILE; i++) for (const o of [0, 8]) {
          const d = (i + o) % TILE;
          g.fillRect(x + d, y + i, 1, 1);
        }
      }
    }
    let lx = 4;
    g.fillStyle = "rgba(24,20,37,0.85)";
    g.fillRect(0, H - 11, W, 11);
    for (const k of Object.keys(T)) {
      g.fillStyle = T[k].col;
      g.fillRect(lx, H - 8, 5, 5);
      textShadow(g, T[k].label.toUpperCase(), lx + 8, H - 9, PAL.silver);
      lx += 14 + T[k].label.length * 4;
    }
  },
  /** Ghost of a captured block at tile (x, y): its tiles half-transparent, its entities as amber outlines. */
  drawClip(g, clip, x, y, cx, cy) {
    g.globalAlpha = 0.65;
    clip.rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === ".") continue;
        const at = (a2, b) => clip.rows[b]?.[a2] === ch;
        Tiles.draw(g, ch, (x + i) * TILE - cx, (y + j) * TILE - cy, { u: at(i, j - 1), d: at(i, j + 1), l: at(i - 1, j), r: at(i + 1, j) }, x + i, y + j, 0);
      }
    });
    g.globalAlpha = 1;
    g.strokeStyle = PAL.amber;
    for (const e of clip.ents) {
      const r = this.entityRect({ ...e, x: 0, y: 0 });
      g.strokeRect((x + e.x) * TILE - cx + 0.5, (y + e.y) * TILE - cy + 0.5, Math.max(TILE, r.w) - 1, Math.max(TILE, r.h) - 1);
    }
  },
  drawPlacePreview(g, x, y) {
    const p = this.place;
    g.globalAlpha = 0.55;
    let spr = null;
    if (p.type === "monster") spr = Art.frame(`${Data.monsters[p.kind]?.sprite}_idle`);
    else if (p.type === "pickup") spr = Art.frame(Data.pickups[p.kind]?.sprite);
    else if (p.type === "decor") spr = Art.frame(`decor_${p.kind}`);
    else if (p.type === "door") spr = Art.frame("door", 0);
    else if (p.type === "teleporter") spr = Art.frame("teleporter", 0);
    else if (p.type === "exit") spr = Art.frame("exit_portal", 0);
    else if (p.type === "player") spr = Art.frame("guy_idle", 0);
    else if (p.type === "sign") spr = Art.frame("sign");
    else if (p.type === "mover") spr = Art.frame("mover");
    else if (p.type === "spawnpoint") spr = Art.frame("spawnpoint");
    if (spr) {
      if (p.type === "mover") g.drawImage(spr, x, y);
      else if (p.type === "decor") g.drawImage(spr, x, y + TILE - spr.height);
      else {
        const [fw, fh] = Array.isArray(ENTITY_SCHEMA[p.type]?.size) ? ENTITY_SCHEMA[p.type].size : [1, 1];
        g.drawImage(spr, x + (fw * TILE - spr.width) / 2, y + fh * TILE - spr.height);
      }
    }
    g.globalAlpha = 1;
  }
};

// js/main.js
async function boot() {
  await Data.load();
  Settings.load();
  Progress.load();
  if (Settings.data.binds) Input.binds = { ...Input.binds, ...Settings.data.binds };
  Audio_.volume = Settings.data.volume;
  Audio_.musicVolume = Settings.data.music;
  Audio_.musicOn = Settings.data.musicOn !== false;
  const canvas = document.getElementById("screen");
  Render.init(canvas);
  Input.attach(canvas);
  const unlock = () => {
    Audio_.init();
    Audio_.resume();
  };
  window.addEventListener("pointerdown", unlock);
  window.addEventListener("keydown", unlock);
  UI.init({
    play: (lvl) => {
      UI.hide();
      Game.start(lvl);
    },
    openEditor: (lvl) => {
      UI.hide();
      Editor.open(lvl);
    },
    resume: () => Game.resume(),
    restart: () => Game.restart(),
    quit: () => Game.quit(),
    isFromEditor: () => Game.fromEditor,
    giveMod: (id, modId) => Game.world?.player?.giveMod(id, modId),
    syncPlayer: () => {
      const p = Game.world?.player;
      if (p) {
        const hp = p.hp, ar = p.armor, ammo = { ...p.ammo };
        p.loadProgress(Progress);
        p.hp = Math.min(hp, p.maxHp) || p.maxHp;
        p.armor = ar;
        p.ammo = ammo;
      }
    },
    // Hellstone: raise the cap and fill the stat to it
    hellstone: (stat) => {
      const p = Game.world?.player;
      if (!p) return;
      UI.hooks.syncPlayer();
      if (stat === "health") {
        p.hp = p.maxHp;
        Game.world.message(`MAX HEALTH ${p.maxHp}`, 2.5, "sky");
      }
      if (stat === "armor") {
        p.armor = p.maxArmor;
        Game.world.message(`MAX ARMOR ${p.maxArmor}`, 2.5, "lime");
      }
      if (stat === "ammo") {
        for (const a2 of Object.keys(Data.weapons.ammoMax)) p.ammo[a2] = Weapons.ammoMax(a2, p);
        Game.world.message("AMMO CAPACITY UP, AMMO FULL", 2.5, "amber");
      }
    }
  });
  UI.show("main");
  Console.init(() => Game);
  let last = performance.now(), acc = 0, fps = 0, frames = 0, fpsT = 0;
  const g = Render.bg;
  function frame(now) {
    const elapsed = Math.min(0.1, (now - last) / 1e3);
    last = now;
    acc += elapsed;
    frames++;
    fpsT += elapsed;
    if (fpsT >= 1) {
      fps = frames;
      frames = 0;
      fpsT = 0;
    }
    const inEditor = Editor.active;
    while (acc >= DT) {
      try {
        if (inEditor) Editor.update(DT);
        else if (!Console.isOpen) Game.update(DT);
      } catch (err) {
        reportError(err);
      }
      Input.endFrame();
      acc -= DT;
    }
    g.imageSmoothingEnabled = false;
    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);
    try {
      if (inEditor) Editor.draw(g);
      else if (Game.world) Game.draw(g);
      else drawTitle(g, now / 1e3);
    } catch (err) {
      reportError(err);
    }
    if (lastError && now - lastErrorAt < 6e3) textShadow(g, `ERROR: ${lastError}`.slice(0, 110), 4, H - 36, PAL.scarlet, 1);
    if (Settings.data.showFps) textShadow(g, `${fps} FPS`, W - 4, H - 36, PAL.steel, 1, "right");
    Render.present();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
var lastError = "";
var lastErrorAt = 0;
var errorCount = 0;
function reportError(err) {
  errorCount++;
  if (errorCount <= 20 || errorCount % 300 === 0) console.error(err);
  lastError = String(err?.message || err);
  lastErrorAt = performance.now();
}
function drawTitle(g, t) {
  const { Art: Art2 } = titleArt;
  g.drawImage(Art2.frame("skybox_mars"), 0, 0);
  const far = Art2.frame("parallax_far");
  for (let x = -(t * 6 % 480); x < W; x += 480) g.drawImage(far, x, 150);
  g.fillStyle = "#3e2731";
  g.fillRect(0, 230, W, 40);
  const guy = Art2.frame("guy_idle", Math.floor(t * 2));
  g.drawImage(guy, 0, 0, guy.width, guy.height, 200, 230 - 54, 42, 54);
  const imp = Art2.frame("imp_walk", Math.floor(t * 6));
  g.drawImage(Art2.flipped(imp), 0, 0, imp.width, imp.height, 300 + Math.sin(t) * 10, 230 - 42, 33, 42);
  const brimjelly2 = Art2.frame("brimjelly_idle", Math.floor(t * 2));
  g.drawImage(brimjelly2, 0, 0, 18, 18, 120, 120 + Math.sin(t * 2) * 8, 54, 54);
}
var titleArt = { Art };
boot().catch((err) => {
  console.error(err);
  document.body.insertAdjacentHTML("beforeend", `<pre class="err" style="position:fixed;inset:20px;overflow:auto">${err.stack || err}</pre>`);
});
</script>
</body>
